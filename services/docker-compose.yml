version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d userdb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  dynamodb:
    image: amazon/dynamodb-local:1.21.0
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/8000' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    command: [ "-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb" ]
    networks:
      - app-network

  user-service:
    build: ./user-service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: userdb
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  tweet-service:
    build: ./tweet-service
    ports:
      - "8081:8081"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      DYNAMODB_ENDPOINT: http://dynamodb:8000
    depends_on:
      dynamodb:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres-data:


networks:
  app-network:
    driver: bridge
